<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>予約ステータス確認</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap');

  body {
    background: #0a0e1a;
    color: #e0e6f0;
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 20px;
  }

  h1 { font-size: 1.4rem; letter-spacing: 0.05em; margin-bottom: 8px; }
  .subtitle { color: #4a6080; font-size: 0.85rem; margin-bottom: 32px; }

  .input-card {
    background: #111827;
    border: 1px solid #1e2d40;
    border-radius: 12px;
    padding: 24px;
    width: 100%;
    max-width: 360px;
    margin-bottom: 24px;
  }

  .form-control {
    background: #0d1525;
    border: 1px solid #1e2d40;
    color: #e0e6f0;
    border-radius: 8px;
    padding: 12px 16px;
    width: 100%;
    font-size: 15px;
    outline: none;
    margin-bottom: 12px;
    display: block;
  }
  .form-control:focus { border-color: rgba(0,180,255,0.4); }
  .form-control::placeholder { color: #2a3a50; }

  .btn-check {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, rgba(0,180,255,0.15), rgba(0,180,255,0.08));
    border: 1px solid rgba(0,180,255,0.3);
    color: #00b4ff;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-check:hover { background: rgba(0,180,255,0.2); }

  /* ステータスカード */
  .status-card {
    background: #111827;
    border: 1px solid #1e2d40;
    border-radius: 16px;
    padding: 32px 24px;
    width: 100%;
    max-width: 360px;
    text-align: center;
    display: none;
    position: relative;
    overflow: hidden;
  }

  .status-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }

  .status-waiting::before  { background: linear-gradient(90deg, transparent, #4a6080, transparent); }
  .status-called::before   { background: linear-gradient(90deg, transparent, #00ff88, transparent); }
  .status-completed::before{ background: linear-gradient(90deg, transparent, #888, transparent); }

  .status-icon { font-size: 3rem; margin-bottom: 12px; }
  .status-label { font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 8px; }
  .status-number { font-size: 5rem; font-weight: 900; line-height: 1; margin-bottom: 8px; }

  .status-waiting  .status-number { color: #4a8090; }
  .status-called   .status-number { color: #00ff88; text-shadow: 0 0 30px rgba(0,255,136,0.5); }
  .status-completed .status-number { color: #555; }

  .status-text { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
  .status-sub  { font-size: 0.85rem; color: #4a6080; }

  .status-waiting   .status-text { color: #8090a0; }
  .status-called    .status-text { color: #00ff88; }
  .status-completed .status-text { color: #666; }

  /* 呼出中は点滅 */
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .status-called .status-icon { animation: pulse 1.2s ease-in-out infinite; }

  .error-msg { color: #ff4d6d; font-size: 0.9rem; margin-top: 8px; text-align: center; display: none; }
  .timeslot-badge {
    display: inline-block;
    background: rgba(255,255,255,0.05);
    border: 1px solid #1e2d40;
    border-radius: 6px;
    padding: 4px 12px;
    font-size: 0.85rem;
    color: #4a6080;
    margin-top: 12px;
  }
</style>
</head>
<body>
  <h1>予約ステータス確認</h1>
  <p class="subtitle">整理番号とパスワードを入力してください</p>

  <div class="input-card">
    <input type="number" id="number" class="form-control" placeholder="整理番号">
    <input type="text"   id="password" class="form-control" placeholder="パスワード">
    <button class="btn-check" onclick="checkStatus()">確認する</button>
    <div class="error-msg" id="error-msg">整理番号またはパスワードが正しくありません</div>
  </div>

  <div class="status-card" id="status-card">
    <div class="status-icon" id="status-icon"></div>
    <div class="status-label">整理番号</div>
    <div class="status-number" id="status-number"></div>
    <div class="status-text" id="status-text"></div>
    <div class="status-sub"  id="status-sub"></div>
    <div class="timeslot-badge" id="timeslot-badge"></div>
  </div>

<script>
let currentNumber = null;
let currentPassword = null;
let pollTimer = null;

function checkStatus(){
    currentNumber   = $("#number").val();
    currentPassword = $("#password").val();
    if(!currentNumber || !currentPassword) return;
    $("#error-msg").hide();
    fetchStatus();
}

function fetchStatus(){
    $.getJSON("/admin_data", function(data){
        let found = false;
        for(const slot in data){
            data[slot].forEach(r => {
                if(String(r.id) === String(currentNumber) && r.password === currentPassword){
                    found = true;
                    renderStatus(r, slot);
                }
            });
        }
        if(!found){
            $("#status-card").hide();
            $("#error-msg").show();
            clearInterval(pollTimer);
        }
    });
}

function renderStatus(r, slot){
    const $card = $("#status-card");
    $card.removeClass("status-waiting status-called status-completed").show();

    if(r.completed){
        $card.addClass("status-completed");
        $("#status-icon").text("✓");
        $("#status-text").text("受付完了");
        $("#status-sub").text("ご来店ありがとうございました");
        clearInterval(pollTimer);
    } else if(r.called){
        $card.addClass("status-called");
        $("#status-icon").text("🔔");
        $("#status-text").text("呼び出されています！");
        $("#status-sub").text("受付カウンターへお越しください");
    } else {
        $card.addClass("status-waiting");
        $("#status-icon").text("⏳");
        $("#status-text").text("お待ちください");
        $("#status-sub").text("呼び出しまでしばらくお待ちください");
    }

    $("#status-number").text(r.id);
    $("#timeslot-badge").text("予約時間: " + slot);

    // ポーリング開始（完了後は停止済み）
    if(!r.completed){
        clearInterval(pollTimer);
        pollTimer = setInterval(fetchStatus, 3000);
    }
}

// Enterキー対応
$(document).on("keydown", function(e){
    if(e.key === "Enter") checkStatus();
});
</script>
</body>
</html>
