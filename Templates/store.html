<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>受付状況</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
  :root {
    --green:    #00ff88;
    --yellow:   #ffd700;
    --bg:       #0a0e1a;
    --card-bg:  #111827;
    --border:   #1e2d40;
    --text:     #e0e6f0;
    --muted:    #4a6080;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    overflow: hidden;
  }

  /* ── 全体レイアウト ── */
  .board {
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
    padding: 20px;
    gap: 16px;
  }

  /* ── ヘッダー ── */
  .board-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    padding-bottom: 16px;
  }
  .board-title {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .board-clock {
    font-family: 'Orbitron', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  /* ── メインパネル 2分割 ── */
  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    overflow: hidden;
  }

  .panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .panel-called::before  { background: linear-gradient(90deg, transparent, var(--green), transparent); }
  .panel-waiting::before { background: linear-gradient(90deg, transparent, var(--yellow), transparent); }

  .panel-header {
    padding: 20px 24px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .panel-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .panel-called  .panel-dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .panel-waiting .panel-dot { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }

  .panel-label {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .panel-called  .panel-label { color: var(--green); }
  .panel-waiting .panel-label { color: var(--yellow); }

  .panel-count {
    margin-left: auto;
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }

  /* ── 番号グリッド ── */
  .number-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    padding: 20px 24px;
    align-content: flex-start;
    overflow-y: auto;
    flex: 1;
  }

  .num-tile {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    border-radius: 12px;
    border: 2px solid;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  /* 呼び出し中 — 大きく目立つ */
  .panel-called .num-tile {
    font-size: clamp(2rem, 5vw, 4rem);
    padding: 16px 24px;
    color: var(--green);
    border-color: rgba(0,255,136,0.35);
    background: rgba(0,255,136,0.07);
    text-shadow: 0 0 24px rgba(0,255,136,0.6);
    box-shadow: 0 0 20px rgba(0,255,136,0.08) inset;
  }

  /* 待機中 — やや小さめ */
  .panel-waiting .num-tile {
    font-size: clamp(1.4rem, 3.5vw, 2.8rem);
    padding: 12px 20px;
    color: var(--yellow);
    border-color: rgba(255,215,0,0.3);
    background: rgba(255,215,0,0.05);
    text-shadow: 0 0 16px rgba(255,215,0,0.4);
  }

  /* 空の状態 */
  .empty-msg {
    color: var(--border);
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    padding: 20px 0;
    width: 100%;
    text-align: center;
  }

  /* ── フッター（受付フォーム） ── */
  .board-footer {
    border-top: 1px solid var(--border);
    padding-top: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .footer-label {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--muted);
    white-space: nowrap;
  }

  .footer-input {
    background: var(--card-bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    font-family: 'Noto Sans JP', sans-serif;
    outline: none;
    transition: border-color 0.2s;
    width: 130px;
  }
  .footer-input:focus { border-color: rgba(0,255,136,0.4); }
  .footer-input::placeholder { color: #2a3a50; }

  .footer-btn {
    background: linear-gradient(135deg, rgba(0,255,136,0.15), rgba(0,255,136,0.08));
    border: 1px solid rgba(0,255,136,0.35);
    color: var(--green);
    border-radius: 8px;
    padding: 10px 20px;
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .footer-btn:hover { background: rgba(0,255,136,0.2); box-shadow: 0 0 16px rgba(0,255,136,0.12); }
  .footer-btn:active { transform: scale(0.97); }

  #footer-msg {
    font-size: 13px;
    min-width: 120px;
    text-align: center;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .msg-ok  { color: var(--green); }
  .msg-err { color: #ff4d6d; }

  /* アニメーション */
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* スクロールバー */
  .number-grid::-webkit-scrollbar { width: 4px; }
  .number-grid::-webkit-scrollbar-track { background: transparent; }
  .number-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div class="board">

  <!-- ヘッダー -->
  <div class="board-header">
    <span class="board-title">Reception Board</span>
    <span class="board-clock" id="clock">--:--:--</span>
  </div>

  <!-- メインパネル -->
  <div class="panels">

    <!-- 呼び出し中パネル -->
    <div class="panel panel-called">
      <div class="panel-header">
        <div class="panel-dot"></div>
        <span class="panel-label">呼び出し中</span>
        <span class="panel-count" id="called-count">0件</span>
      </div>
      <div class="number-grid" id="called-area">
        <span class="empty-msg">— STAND BY —</span>
      </div>
    </div>

    <!-- 待機中パネル -->
    <div class="panel panel-waiting">
      <div class="panel-header">
        <div class="panel-dot"></div>
        <span class="panel-label">待機中</span>
        <span class="panel-count" id="waiting-count">0件</span>
      </div>
      <div class="number-grid" id="waiting-area">
        <span class="empty-msg">— STAND BY —</span>
      </div>
    </div>

  </div>

  <!-- フッター受付フォーム -->
  <div class="board-footer">
    <span class="footer-label">受付</span>
    <input type="number" id="recv-number" class="footer-input" placeholder="整理番号">
    <input type="text"   id="recv-password" class="footer-input" placeholder="パスワード">
    <button class="footer-btn" onclick="doReceive()">受 付</button>
    <span id="footer-msg"></span>
  </div>

</div>

<script>
// 時計
function updateClock(){
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    const s = String(now.getSeconds()).padStart(2,'0');
    document.getElementById('clock').textContent = `${h}:${m}:${s}`;
}
setInterval(updateClock, 1000);
updateClock();

// ボード更新
function loadBoard(){
    $.getJSON("/admin_data", function(data){
        let calledHtml = "", waitingHtml = "";
        let calledCount = 0, waitingCount = 0;

        for(const slot in data){
            data[slot].forEach(r => {
                if(r.completed) return; // 完了済みは表示しない

                if(r.called){
                    calledHtml += `<div class="num-tile">${r.id}</div>`;
                    calledCount++;
                } else {
                    // 呼び出されていない = 待機中
                    waitingHtml += `<div class="num-tile">${r.id}</div>`;
                    waitingCount++;
                }
            });
        }

        $("#called-area").html(calledCount > 0 ? calledHtml : '<span class="empty-msg">— STAND BY —</span>');
        $("#waiting-area").html(waitingCount > 0 ? waitingHtml : '<span class="empty-msg">— STAND BY —</span>');
        $("#called-count").text(calledCount + "件");
        $("#waiting-count").text(waitingCount + "件");
    });
}

setInterval(loadBoard, 3000);
loadBoard();

// 受付処理
function doReceive(){
    const number   = $("#recv-number").val();
    const password = $("#recv-password").val();
    if(!number || !password) return;

    $.post("/store_action", {number, password}, function(data){
        const $msg = $("#footer-msg");
        if(data.status === "ok"){
            $msg.text("受付完了！").attr("class","msg-ok");
            $("#recv-number").val("");
            $("#recv-password").val("");
            loadBoard();
        } else {
            $msg.text("認証失敗").attr("class","msg-err");
        }
        setTimeout(() => $msg.text("").attr("class",""), 2500);
    });
}

// Enterキー対応
$(document).on("keydown", function(e){
    if(e.key === "Enter") doReceive();
});
</script>
</body>
</html>
