<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>スタッフ受付</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green:   #00ff88;
    --blue:    #00b4ff;
    --orange:  #ff9500;
    --bg:      #0a0e1a;
    --card-bg: #111827;
    --border:  #1e2d40;
    --text:    #e0e6f0;
    --muted:   #4a6080;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(0,255,136,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(0,120,255,0.06) 0%, transparent 60%);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo     { font-family: 'Orbitron', monospace; font-size: 14px; font-weight: 700; letter-spacing: 0.25em; color: var(--green); }
  .logo-sep { color: var(--border); }
  .logo-sub { font-size: 11px; letter-spacing: 0.2em; color: var(--muted); }
  .logo-role {
    margin-left: auto;
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--orange);
    border: 1px solid rgba(255,149,0,0.3);
    border-radius: 4px;
    padding: 4px 10px;
  }

  .page {
    max-width: 700px;
    margin: 0 auto;
    padding: 36px 24px 80px;
  }

  .page-label   { font-family: 'Orbitron', monospace; font-size: 11px; letter-spacing: 0.3em; color: var(--muted); margin-bottom: 8px; }
  .page-heading { font-size: 1.5rem; font-weight: 700; margin-bottom: 28px; }

  /* ── 「今」ボタン ── */
  .now-section {
    margin-bottom: 24px;
  }
  .btn-now {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, rgba(255,149,0,0.18), rgba(255,149,0,0.08));
    border: 1px solid rgba(255,149,0,0.5);
    color: var(--orange);
    border-radius: 10px;
    padding: 16px 28px;
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: all 0.2s;
    text-shadow: 0 0 10px rgba(255,149,0,0.3);
    width: 100%;
    justify-content: center;
  }
  .btn-now:hover {
    background: linear-gradient(135deg, rgba(255,149,0,0.28), rgba(255,149,0,0.14));
    box-shadow: 0 0 24px rgba(255,149,0,0.15);
  }
  .btn-now:active { transform: scale(0.98); }
  .now-hint {
    font-size: 0.75rem;
    color: var(--muted);
    text-align: center;
    margin-top: 8px;
    letter-spacing: 0.05em;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: var(--muted);
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── スロットグリッド ── */
  .slots-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 8px;
    margin-bottom: 28px;
  }
  .slot-label { display: block; cursor: pointer; }
  .slot-label input[type="radio"] { display: none; }
  .slot-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 8px;
    text-align: center;
    transition: border-color 0.18s, transform 0.12s;
    position: relative; overflow: hidden;
  }
  .slot-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    opacity: 0; transition: opacity 0.18s;
  }
  .slot-label:not(.is-full):hover .slot-box { border-color: rgba(0,255,136,0.4); transform: translateY(-2px); }
  .slot-label:not(.is-full):hover .slot-box::before { opacity: 1; }
  .slot-label input[type="radio"]:checked + .slot-box { border-color: var(--green); background: rgba(0,255,136,0.07); }
  .slot-label input[type="radio"]:checked + .slot-box::before { opacity: 1; }
  .slot-time { font-family: 'Orbitron', monospace; font-size: 0.95rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .slot-label input[type="radio"]:checked + .slot-box .slot-time { color: var(--green); }
  .slot-count { font-size: 0.68rem; color: var(--muted); }
  .slot-label.is-full { cursor: not-allowed; }
  .slot-label.is-full .slot-box { opacity: 0.35; }
  .full-tag { font-family: 'Orbitron', monospace; font-size: 0.55rem; letter-spacing: 0.12em; color: #ff4d6d; border: 1px solid rgba(255,77,109,0.3); border-radius: 3px; padding: 1px 5px; margin-top: 3px; display: inline-block; }

  /* ── 名前入力 ── */
  .field-group  { margin-bottom: 24px; }
  .field-label  { display: block; font-family: 'Orbitron', monospace; font-size: 10px; letter-spacing: 0.2em; color: var(--muted); margin-bottom: 8px; }
  .field-input  {
    background: var(--card-bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 13px 16px; width: 100%; max-width: 320px;
    font-size: 15px; font-family: 'Noto Sans JP', sans-serif;
    outline: none; transition: border-color 0.2s; display: block;
  }
  .field-input:focus { border-color: rgba(0,255,136,0.5); box-shadow: 0 0 0 3px rgba(0,255,136,0.07); }
  .field-input::placeholder { color: #2a3a50; }

  /* ── 登録ボタン ── */
  .btn-register {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, rgba(0,255,136,0.15), rgba(0,255,136,0.08));
    border: 1px solid rgba(0,255,136,0.4);
    color: var(--green);
    border-radius: 8px;
    padding: 14px 32px;
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-register:hover { background: linear-gradient(135deg, rgba(0,255,136,0.25), rgba(0,255,136,0.12)); box-shadow: 0 0 24px rgba(0,255,136,0.15); }
  .btn-register:active { transform: scale(0.98); }

  /* ── 完了トースト ── */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--card-bg);
    border: 1px solid rgba(0,255,136,0.4);
    border-radius: 12px;
    padding: 16px 28px;
    font-family: 'Orbitron', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--green);
    box-shadow: 0 0 30px rgba(0,255,136,0.15);
    transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
    opacity: 0;
    z-index: 100;
    white-space: nowrap;
    text-align: center;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .toast-number { font-size: 1.6rem; font-weight: 900; text-shadow: 0 0 16px rgba(0,255,136,0.5); display: block; margin-bottom: 4px; }
  .toast-label  { font-size: 10px; color: var(--muted); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .page { animation: fadeUp 0.4s ease both; }

  @media (max-width: 480px) {
    .slots-grid { grid-template-columns: repeat(4, 1fr); }
    .slot-time  { font-size: 0.8rem; }
  }
</style>
</head>
<body>

<header>
  <span class="logo">RESERVE</span>
  <span class="logo-sep">|</span>
  <span class="logo-sub">予約システム</span>
  <span class="logo-role">STAFF</span>
</header>

<div class="page">
  <p class="page-label">Staff — Queue Entry</p>
  <h1 class="page-heading">受付登録</h1>

  <!-- 名前入力（フォーム外で先に取得） -->
  <div class="field-group">
    <label class="field-label" for="name">お名前</label>
    <input class="field-input" type="text" id="name" placeholder="お名前を入力" autocomplete="off">
  </div>

  <!-- 今ボタン -->
  <div class="now-section">
    <button class="btn-now" onclick="reserveNow()">
      ⚡ 今すぐ登録
    </button>
    <p class="now-hint" id="now-hint">現在時刻に最も近い空き枠に自動で登録します</p>
  </div>

  <div class="divider">または時間を選択</div>

  <!-- スロットグリッド -->
  <div class="slots-grid" id="slots-grid">
    {% for slot in slots %}
      {% if counts[slot] >= maxcap %}
        <label class="slot-label is-full">
          <div class="slot-box">
            <div class="slot-time">{{ slot }}</div>
            <div class="slot-count">{{ counts[slot] }} / {{ maxcap }}</div>
            <span class="full-tag">FULL</span>
          </div>
        </label>
      {% else %}
        <label class="slot-label">
          <input type="radio" name="timeslot" value="{{ slot }}">
          <div class="slot-box">
            <div class="slot-time">{{ slot }}</div>
            <div class="slot-count">{{ counts[slot] }} / {{ maxcap }}</div>
          </div>
        </label>
      {% endif %}
    {% endfor %}
  </div>

  <button class="btn-register" onclick="reserveSlot()">キューに登録 →</button>
</div>

<!-- 完了トースト -->
<div class="toast" id="toast">
  <span class="toast-number" id="toast-number"></span>
  <span class="toast-label" id="toast-label"></span>
</div>

<script>
// スロットデータをJinja2から取得
const slotsData = [
  {% for slot in slots %}
    { time: "{{ slot }}", count: {{ counts[slot] }}, full: {{ 'true' if counts[slot] >= maxcap else 'false' }} },
  {% endfor %}
];
const MAX_CAP = {{ maxcap }};

// 今の時刻に最も近い空き枠を探す
function findBestSlot(){
    const now = new Date();
    const nowMin = now.getHours() * 60 + now.getMinutes();

    // スロット時刻を分に変換
    function toMin(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }

    // 現在時刻以降で空いている最も早い枠
    const available = slotsData.filter(s => !s.full && toMin(s.time) >= nowMin);
    if(available.length > 0) return available[0].time;

    // 全部過ぎていたら空いている最も早い枠
    const anyAvail = slotsData.filter(s => !s.full);
    if(anyAvail.length > 0) return anyAvail[0].time;

    return null;
}

// 共通登録処理
function doReserve(timeslot){
    const name = document.getElementById('name').value.trim();
    if(!name){ alert('お名前を入力してください'); return; }

    fetch('/staff_reserve', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ name, timeslot })
    })
    .then(r => r.json())
    .then(data => {
        if(data.status === 'ok'){
            showToast(data.number, data.timeslot, name);
            document.getElementById('name').value = '';
            // ラジオボタンをリセット
            document.querySelectorAll('input[name="timeslot"]').forEach(r => r.checked = false);
            // スロット表示を再読み込み
            setTimeout(() => location.reload(), 1800);
        } else {
            alert(data.message || '登録に失敗しました');
        }
    });
}

function reserveNow(){
    const slot = findBestSlot();
    if(!slot){ alert('空き枠がありません'); return; }
    doReserve(slot);
}

function reserveSlot(){
    const selected = document.querySelector('input[name="timeslot"]:checked');
    if(!selected){ alert('時間帯を選択してください'); return; }
    doReserve(selected.value);
}

// トースト表示
function showToast(number, timeslot, name){
    const $toast = document.getElementById('toast');
    document.getElementById('toast-number').textContent = '#' + number;
    document.getElementById('toast-label').textContent = name + ' — ' + timeslot + ' に登録しました';
    $toast.classList.add('show');
    setTimeout(() => $toast.classList.remove('show'), 2500);
}

// 現在時刻のヒントを更新
function updateNowHint(){
    const slot = findBestSlot();
    const hint = document.getElementById('now-hint');
    if(slot) hint.textContent = '→ ' + slot + ' の枠に登録します';
    else hint.textContent = '空き枠がありません';
}
updateNowHint();
setInterval(updateNowHint, 30000);
</script>
</body>
</html>
