<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>予約完了</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green:   #00ff88;
    --bg:      #0a0e1a;
    --card-bg: #111827;
    --border:  #1e2d40;
    --text:    #e0e6f0;
    --muted:   #4a6080;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(0,255,136,0.04) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(0,120,255,0.06) 0%, transparent 60%);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
  }
  header {
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo { font-family: 'Orbitron', monospace; font-size: 14px; font-weight: 700; letter-spacing: 0.25em; color: var(--green); }
  .logo-sep { color: var(--border); }
  .logo-sub { font-size: 11px; letter-spacing: 0.2em; color: var(--muted); }

  .page {
    max-width: 480px;
    margin: 0 auto;
    padding: 56px 24px 80px;
    text-align: center;
    animation: fadeUp 0.5s ease both;
  }

  /* 完了アイコン */
  .check-wrap {
    margin-bottom: 24px;
  }
  .check-circle {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 2px solid rgba(0,255,136,0.4);
    background: rgba(0,255,136,0.06);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    color: var(--green);
    text-shadow: 0 0 16px rgba(0,255,136,0.6);
    animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  .page-label {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--green);
    margin-bottom: 8px;
  }
  .page-heading {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 40px;
    color: var(--text);
  }

  /* 整理番号 */
  .number-section { margin-bottom: 32px; }
  .number-label {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .number-display {
    font-family: 'Orbitron', monospace;
    font-size: 6rem;
    font-weight: 900;
    line-height: 1;
    color: var(--green);
    text-shadow: 0 0 40px rgba(0,255,136,0.5);
  }

  /* 詳細カード */
  .detail-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 24px;
    text-align: left;
    position: relative;
  }
  .detail-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
  }
  .detail-row {
    display: flex;
    align-items: center;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-key {
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--muted);
    width: 90px;
    flex-shrink: 0;
  }
  .detail-val {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
  }

  /* 注意書き */
  .notice {
    background: rgba(0,255,136,0.04);
    border: 1px solid rgba(0,255,136,0.15);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 0.8rem;
    color: var(--muted);
    line-height: 1.8;
    margin-bottom: 28px;
    text-align: left;
  }

  /* ボタン */
  .btn-status {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, rgba(0,255,136,0.15), rgba(0,255,136,0.08));
    border: 1px solid rgba(0,255,136,0.4);
    color: var(--green);
    border-radius: 8px;
    padding: 14px;
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: all 0.2s;
    margin-bottom: 12px;
    text-shadow: 0 0 10px rgba(0,255,136,0.3);
  }
  .btn-status:hover {
    background: linear-gradient(135deg, rgba(0,255,136,0.25), rgba(0,255,136,0.12));
    box-shadow: 0 0 24px rgba(0,255,136,0.15);
  }

  .btn-top {
    display: block;
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 13px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
    transition: border-color 0.2s, color 0.2s;
  }
  .btn-top:hover { border-color: var(--text); color: var(--text); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.6); }
    to   { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
<header>
  <span class="logo">RESERVE</span>
  <span class="logo-sep">|</span>
  <span class="logo-sub">予約システム</span>
</header>

<div class="page">
  <div class="check-wrap">
    <div class="check-circle">✓</div>
  </div>
  <p class="page-label">Booking Complete</p>
  <h1 class="page-heading">予約が完了しました</h1>

  <div class="number-section">
    <p class="number-label">Your Number</p>
    <div class="number-display">{{ number }}</div>
  </div>

  <div class="detail-card">
    <div class="detail-row">
      <span class="detail-key">Time</span>
      <span class="detail-val">{{ timeslot }}</span>
    </div>
    <div class="detail-row">
      <span class="detail-key">Password</span>
      <span class="detail-val">{{ password }}</span>
    </div>
  </div>

  <div class="notice">
    整理番号とパスワードはスクリーンショット等で保存してください。<br>
    呼び出し状況はステータス確認ページからご確認いただけます。
  </div>

  <a href="/status?number={{ number }}" class="btn-status">ステータスを確認する →</a>
  <a href="/" class="btn-top">トップに戻る</a>
</div>
</body>
</html>
