<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>管理画面</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
  body { background: #f0f2f5; }
  .section-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 28px; }
  .badge-id { font-size: 1.2rem; font-weight: bold; }
  .slot-header { font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: #888; margin-bottom: 12px; }
  .row-called { background: #e8fff3; }
  .row-waiting { background: #fff; }
  .row-completed { background: #f5f5f5; color: #999; }
</style>
</head>
<body>
<div class="container py-4">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <h2 class="fw-bold mb-0">🎛 管理画面</h2>
    <button class="btn btn-outline-danger btn-sm" onclick="resetDB()">🗑 データベースをリセット</button>
  </div>

  <div class="section-card">
    <h5 class="mb-3">📋 現在のキュー</h5>
    <div id="queue-content"><p class="text-muted">読み込み中...</p></div>
  </div>

  <div class="section-card">
    <h5 class="mb-3">✅ 完了済み</h5>
    <div id="completed-content"><p class="text-muted">完了済みはありません</p></div>
  </div>
</div>

<script>
function loadAdmin(){
    $.getJSON("/admin_data", function(data){
        let queueHtml = "";
        let completedHtml = "";
        let hasQueue = false, hasCompleted = false;

        for(const slot in data){
            const active = data[slot].filter(r => !r.completed);
            const done   = data[slot].filter(r => r.completed);

            if(active.length > 0){
                hasQueue = true;
                queueHtml += `<p class="slot-header">🕐 ${slot}</p>
                <table class="table table-bordered align-middle mb-4">
                  <thead class="table-light">
                    <tr><th>整理番号</th><th>お名前</th><th>時間</th><th>状態</th><th>操作</th></tr>
                  </thead><tbody>`;
                active.forEach(r => {
                    const rowClass = r.called ? "row-called" : "row-waiting";
                    const statusBadge = r.called
                        ? `<span class="badge bg-success fs-6">呼出中</span>`
                        : `<span class="badge bg-secondary">待機中</span>`;
                    const callBtn = r.called
                        ? `<button class="btn btn-outline-danger btn-sm" onclick="setCalled(${r.id}, false)">取り消す</button>`
                        : `<button class="btn btn-success btn-sm" onclick="setCalled(${r.id}, true)">呼び出す</button>`;
                    queueHtml += `<tr class="${rowClass}">
                      <td><span class="badge-id">${r.id}</span></td>
                      <td>${r.name || "—"}</td>
                      <td>${r.timeslot}</td>
                      <td>${statusBadge}</td>
                      <td>
                        ${callBtn}
                        <button class="btn btn-outline-info btn-sm ms-1" onclick="setCompleted(${r.id}, true)">完了</button>
                      </td>
                    </tr>`;
                });
                queueHtml += "</tbody></table>";
            }

            if(done.length > 0){
                hasCompleted = true;
                completedHtml += `<p class="slot-header">🕐 ${slot}</p>
                <table class="table table-bordered align-middle mb-4">
                  <thead class="table-light">
                    <tr><th>整理番号</th><th>お名前</th><th>時間</th><th>操作</th></tr>
                  </thead><tbody>`;
                done.forEach(r => {
                    completedHtml += `<tr class="row-completed">
                      <td><span class="badge-id">${r.id}</span></td>
                      <td>${r.name || "—"}</td>
                      <td>${r.timeslot}</td>
                      <td><button class="btn btn-outline-warning btn-sm" onclick="setCompleted(${r.id}, false)">取り消してキューに戻す</button></td>
                    </tr>`;
                });
                completedHtml += "</tbody></table>";
            }
        }

        $("#queue-content").html(hasQueue ? queueHtml : "<p class='text-muted'>待機中の予約はありません</p>");
        $("#completed-content").html(hasCompleted ? completedHtml : "<p class='text-muted'>完了済みはありません</p>");
    });
}

function setCalled(id, value){
    $.post("/update", {id: id, field: "called", value: value ? "1" : "0"}, function(){ loadAdmin(); });
}

function setCompleted(id, value){
    $.post("/update", {id: id, field: "completed", value: value ? "1" : "0"}, function(){ loadAdmin(); });
}

function resetDB(){
    if(!confirm('全予約データを削除します。\n本当によろしいですか？\n\nこの操作は取り消せません。')) return;
    if(!confirm('最終確認：データベースをリセットしますか？')) return;
    $.post('/reset_db', function(data){
        if(data.status === 'ok'){
            alert('リセット完了しました。');
            loadAdmin();
        } else {
            alert('エラーが発生しました。');
        }
    });
}

setInterval(loadAdmin, 3000);
loadAdmin();
</script>
</body>
</html>
